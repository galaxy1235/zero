<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="เข้าสู่ระบบหรือสมัครสมาชิก Webrent">
<title>เข้าสู่ระบบ — Webrent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#2563EB;--s:#60A5FA;--lb:#EFF6FF;--bg:#F8FAFC;--t:#0F172A;--t2:#64748B;--bd:#E2E8F0;--er:#DC2626}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;font:400 16px/1.6 'IBM Plex Sans Thai',system-ui,sans-serif;color:var(--t);background:radial-gradient(ellipse at 12% 4%,#dbeafe 0,transparent 38%),radial-gradient(ellipse at 95% 95%,#e0f2fe 0,transparent 38%),var(--bg)}
a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer}
.nav{height:72px;display:flex;align-items:center;justify-content:space-between;max-width:1120px;padding:0 22px;margin:auto}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}.logo b{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--p),#38BDF8);color:white}
.back{color:var(--t2);font-size:14px}.back:hover{color:var(--p)}
.layout{min-height:calc(100vh - 72px);display:grid;place-items:center;padding:28px 18px 54px}
.card{width:min(100%,470px);background:#fff;border:1px solid rgba(226,232,240,.9);border-radius:24px;padding:34px;box-shadow:0 24px 70px -38px rgba(15,23,42,.28)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;border:1px solid #dbeafe;background:var(--lb);color:var(--p);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:600}
h1{font-size:28px;line-height:1.3;margin:16px 0 6px} .sub{margin:0 0 24px;color:var(--t2);font-size:15px}
.tabs{display:grid;grid-template-columns:1fr 1fr;padding:4px;background:var(--bg);border:1px solid var(--bd);border-radius:12px;margin-bottom:22px}
.tabs button{border:0;background:transparent;color:var(--t2);border-radius:9px;padding:9px;font-weight:600}.tabs button[aria-selected=true]{background:white;color:var(--p);box-shadow:0 1px 4px #0f172a12}
.field{display:grid;gap:6px;margin:14px 0}.field label{font-size:14px;font-weight:600}.field input{width:100%;padding:12px 14px;border:1px solid var(--bd);border-radius:11px;outline:none;background:white}.field input:focus{border-color:var(--s);box-shadow:0 0 0 3px #60a5fa30}
.hint{font-size:12px;color:var(--t2);margin-top:-2px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.primary,.google{width:100%;min-height:48px;border-radius:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px;transition:.2s}
.primary{border:0;color:white;background:var(--p);box-shadow:0 8px 18px -10px #2563ebaa;margin-top:18px}.primary:hover{background:#1d4fd8;transform:translateY(-1px)}.google{border:1px solid var(--bd);background:white;margin-top:14px}.google:hover{background:#f8fafc;border-color:#cbd5e1}
.divider{display:flex;align-items:center;gap:12px;color:#94a3b8;font-size:13px;margin-top:17px}.divider:before,.divider:after{content:'';height:1px;background:var(--bd);flex:1}
.message{display:none;padding:11px 13px;border-radius:10px;font-size:14px;margin-top:16px}.message.show{display:block}.message.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}.message.ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.fine{font-size:12px;text-align:center;color:var(--t2);margin:20px 0 0}.fine a{color:var(--p);text-decoration:underline}
.busy{opacity:.7;pointer-events:none}
@media(max-width:520px){.nav{height:62px}.layout{min-height:calc(100vh - 62px);padding:18px 12px 36px}.card{padding:26px 21px;border-radius:20px}h1{font-size:25px}}
</style>
</head>
<body>
<header class="nav"><a class="logo" href="index.html"><b>W</b>Webrent</a><a class="back" href="index.html">กลับหน้าเว็บไซต์</a></header>
<main class="layout"><section class="card" aria-labelledby="title">
  <span class="eyebrow">เว็บไซต์ของคุณ เริ่มต้นที่นี่</span>
  <h1 id="title">ยินดีต้อนรับกลับ</h1><p class="sub" id="subtitle">เข้าสู่ระบบเพื่อจัดการเว็บไซต์ที่เช่าไว้</p>
  <div class="tabs" role="tablist" aria-label="บัญชีผู้ใช้"><button id="loginTab" role="tab" aria-selected="true" type="button">เข้าสู่ระบบ</button><button id="signupTab" role="tab" aria-selected="false" type="button">สมัครสมาชิก</button></div>
  <form id="authForm" novalidate>
    <div class="field" id="nameField" hidden><label for="fullName">ชื่อที่ใช้แสดง</label><input id="fullName" autocomplete="name" maxlength="80" placeholder="ชื่อของคุณ"></div>
    <div class="field"><label for="email" id="emailLabel">อีเมลหรือชื่อผู้ใช้</label><input id="email" type="text" autocomplete="username" required placeholder="name@example.com หรือ olafshop"></div>
    <div class="field"><div class="row"><label for="password">รหัสผ่าน</label><a id="forgot" class="hint" href="#">ลืมรหัสผ่าน?</a></div><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="อย่างน้อย 6 ตัวอักษร"></div>
    <div class="field" id="confirmField" hidden><label for="confirm">ยืนยันรหัสผ่าน</label><input id="confirm" type="password" autocomplete="new-password" minlength="6" placeholder="กรอกรหัสผ่านอีกครั้ง"></div>
    <button class="primary" id="submit" type="submit">เข้าสู่ระบบ</button>
  </form>
  <div class="divider">หรือ</div>
  <button class="google" id="google" type="button"><svg width="19" height="19" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.72 7.18l7.62 5.91c4.45-4.11 7.14-10.17 7.14-17.56z"/><path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.88.93 7.55 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.89l-7.62-5.91c-2.11 1.42-4.81 2.26-8.28 2.26-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>ดำเนินการต่อด้วย Google</button>
  <div class="message" id="message" role="status" aria-live="polite"></div>
  <p class="fine">การดำเนินการต่อแสดงว่าคุณยอมรับ <a href="#">ข้อกำหนดการใช้บริการ</a> และ <a href="#">นโยบายความเป็นส่วนตัว</a></p>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
(function(){
  var $=function(id){return document.getElementById(id)}, requestedMode=new URLSearchParams(location.search).get('mode'), mode=requestedMode==='signup'?'signup':requestedMode==='recovery'?'recovery':'login';
  var adminEmail='ssonx08@gmail.com', next=new URLSearchParams(location.search).get('next');
  if(next!=='admin.html')next='index.html';
  function client(){var c=window.WEBRENT_SUPABASE;if(!window.supabase||!c||!c.url||c.url.indexOf('YOUR-PROJECT')>-1||!c.anonKey||c.anonKey.indexOf('YOUR_')===0)throw new Error('กรุณาตั้งค่า Supabase Project URL และ anon/publishable key ใน supabase-config.js ก่อน');return window.supabase.createClient(c.url,c.anonKey)}
  function returnUrl(query){var c=window.WEBRENT_SUPABASE,base=c&&c.siteUrl?c.siteUrl.replace(/\/$/,''):location.origin;return base+'/auth.html'+(query||'')}
  function message(text,type){var m=$('message');m.textContent=text;m.className='message show '+type}
  function setMode(v){mode=v;var signup=v==='signup',recovery=v==='recovery';$('loginTab').setAttribute('aria-selected',!signup&&!recovery);$('signupTab').setAttribute('aria-selected',signup);$('nameField').hidden=!signup;$('confirmField').hidden=!signup&&!recovery;$('password').autocomplete=signup||recovery?'new-password':'current-password';$('forgot').hidden=signup||recovery;$('emailLabel').textContent=signup?'อีเมล':'อีเมลหรือชื่อผู้ใช้';$('email').placeholder=signup?'name@example.com':'name@example.com หรือ olafshop';$('title').textContent=signup?'สร้างบัญชี Webrent':recovery?'ตั้งรหัสผ่านใหม่':'ยินดีต้อนรับกลับ';$('subtitle').textContent=signup?'สมัครสมาชิกเพื่อจัดการเว็บไซต์ของคุณ':recovery?'กำหนดรหัสผ่านใหม่สำหรับบัญชีของคุณ':'เข้าสู่ระบบเพื่อจัดการเว็บไซต์ที่เช่าไว้';$('submit').textContent=signup?'สมัครสมาชิก':recovery?'บันทึกรหัสผ่านใหม่':'เข้าสู่ระบบ';$('email').closest('.field').hidden=recovery;$('message').className='message';document.title=(signup?'สมัครสมาชิก':recovery?'ตั้งรหัสผ่านใหม่':'เข้าสู่ระบบ')+' — Webrent'}
  function destination(user){location.replace(user.email&&user.email.toLowerCase()===adminEmail?'admin.html':'index.html')}
  $('loginTab').onclick=function(){setMode('login')};$('signupTab').onclick=function(){setMode('signup')};
  $('authForm').addEventListener('submit',async function(e){e.preventDefault();var form=$('authForm'),email=$('email').value.trim(),password=$('password').value;
    try{var sb=client();form.classList.add('busy');
      if(mode==='recovery'){
        if(password.length<6)throw new Error('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');if(password!==$('confirm').value)throw new Error('รหัสผ่านทั้งสองช่องไม่ตรงกัน');var updated=await sb.auth.updateUser({password:password});if(updated.error)throw updated.error;setMode('login');message('ตั้งรหัสผ่านใหม่แล้ว กรุณาเข้าสู่ระบบ','ok');
      }else if(mode==='signup'){
        var name=$('fullName').value.trim();if(name.length<2)throw new Error('กรุณากรอกชื่ออย่างน้อย 2 ตัวอักษร');if(password!==$('confirm').value)throw new Error('รหัสผ่านทั้งสองช่องไม่ตรงกัน');if(password.length<6)throw new Error('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))throw new Error('กรุณากรอกอีเมลให้ถูกต้อง');
        var res=await sb.auth.signUp({email:email,password:password,options:{data:{full_name:name},emailRedirectTo:returnUrl('?next='+encodeURIComponent(next))}});
        if(res.error)throw res.error;if(res.data.session)destination(res.data.user);else message('สมัครสมาชิกแล้ว กรุณาตรวจสอบอีเมลเพื่อยืนยันบัญชีก่อนเข้าสู่ระบบ','ok');
      }else{
        if(email.toLowerCase()==='olafshop')email=adminEmail;
        var sign=await sb.auth.signInWithPassword({email:email,password:password});if(sign.error)throw sign.error;destination(sign.data.user);
      }
    }catch(err){message(err.message||'เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง','error')}finally{form.classList.remove('busy')}
  });
  $('google').addEventListener('click',async function(){try{var sb=client();$('google').classList.add('busy');var r=await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:returnUrl('?next='+encodeURIComponent(next))}});if(r.error)throw r.error}catch(err){message(err.message||'ไม่สามารถเริ่มเข้าสู่ระบบด้วย Google ได้','error');$('google').classList.remove('busy')}});
  $('forgot').addEventListener('click',async function(e){e.preventDefault();try{var email=$('email').value.trim();if(email.toLowerCase()==='olafshop')email=adminEmail;if(!email)throw new Error('กรอกอีเมลก่อน แล้วกดลืมรหัสผ่านอีกครั้ง');var sb=client(),r=await sb.auth.resetPasswordForEmail(email,{redirectTo:returnUrl('?mode=recovery')});if(r.error)throw r.error;message('ส่งลิงก์ตั้งรหัสผ่านใหม่แล้ว กรุณาตรวจสอบอีเมล','ok')}catch(err){message(err.message,'error')}});
  setMode(mode);
  if(mode!=='recovery'){
    var params=new URLSearchParams(location.search),hashParams=new URLSearchParams(location.hash.replace(/^#/,''));
    var callbackError=params.get('error_description')||params.get('error')||hashParams.get('error_description')||hashParams.get('error');
    if(callbackError)message('เข้าสู่ระบบไม่สำเร็จ: '+callbackError.replace(/\+/g,' '),'error');
    try{
      var authClient=client(),redirecting=false,hasOAuthCallback=params.has('code')||hashParams.has('access_token');
      function acceptSession(session){if(session&&!redirecting){redirecting=true;destination(session.user)}}
      authClient.auth.onAuthStateChange(function(event,session){if(event==='SIGNED_IN'||event==='INITIAL_SESSION')acceptSession(session)});
      authClient.auth.getSession().then(function(result){if(result.data&&result.data.session)acceptSession(result.data.session);else if(hasOAuthCallback&&!callbackError)setTimeout(function(){if(!redirecting)message('Google กลับมาที่เว็บแล้ว แต่ยังไม่ได้รับ session ตรวจสอบ Site URL และ Redirect URLs ใน Supabase แล้วลองใหม่','error')},1800)}).catch(function(err){message(err.message||'ตรวจสอบ session ไม่สำเร็จ','error')});
    }catch(err){message(err.message,'error')}
  }
})();
</script>
</body>
</html>
